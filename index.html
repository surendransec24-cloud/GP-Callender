<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BIT Holiday Calendar 2026–27 | Bannari Amman Institute of Technology</title>
  
  <!-- PWA & Mobile Meta -->
  <meta name="description" content="Official BIT Holiday & GP Leave Calendar for Bannari Amman Institute of Technology students. Clean mobile calendar app with mess closures and .ics sync.">
  <meta name="theme-color" content="#0c3b82">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BIT Calendar">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="alternate icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top App Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-wrapper">
          <div class="college-badge">
            <span class="college-badge-text">BIT</span>
          </div>
          <div class="brand-info">
            <span class="college-name">Bannari Amman Inst. of Tech.</span>
            <h1 class="app-title">Holiday Calendar</h1>
          </div>
        </div>

        <div class="header-actions">
          <!-- Add to Calendar (.ics) Button -->
          <button type="button" class="icon-btn" id="export-ics-btn" title="Add all to my Calendar (.ics)" aria-label="Export calendar">
            <svg viewBox="0 0 24 24">
              <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
          </button>

          <!-- Notification Reminder Button -->
          <button type="button" class="icon-btn" id="notif-btn" title="Set Reminders" aria-label="Notifications">
            <svg viewBox="0 0 24 24">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
            </svg>
          </button>

          <!-- Dark Mode Toggle Button -->
          <button type="button" class="icon-btn" id="theme-toggle-btn" title="Toggle Dark Mode" aria-label="Theme toggle">
            <svg id="theme-icon" viewBox="0 0 24 24">
              <path d="M12.3 2a10 10 0 0 0-.19 20 10.04 10.04 0 0 0 9.71-7.6 1 1 0 0 0-1.21-1.22A8 8 0 0 1 10.6 3.2a1 1 0 0 0-1.2-1.2z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Hero Banner: Next Leave Countdown -->
    <section class="hero-banner-container" id="hero-banner-container" aria-label="Next upcoming leave">
      <!-- Dynamic Hero Content Rendered via JS -->
    </section>

    <!-- Navigation & Filters -->
    <section class="controls-section">
      <!-- View Segmented Switch -->
      <div class="view-segmented-control" role="tablist">
        <button type="button" class="segment-btn active" id="tab-calendar-btn" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/>
          </svg>
          Month View
        </button>
        <button type="button" class="segment-btn" id="tab-upcoming-btn" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24">
            <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
          </svg>
          Upcoming List
        </button>
      </div>

      <!-- Quick Search Bar -->
      <div class="search-wrapper">
        <svg class="search-icon-left" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search festival or holiday..." autocomplete="off">
        <button type="button" class="search-clear-btn" id="search-clear-btn" aria-label="Clear search">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <!-- Filter Chips Bar -->
      <div class="filter-chips-container" role="toolbar" aria-label="Event filters">
        <button type="button" class="filter-chip active" data-filter="all">
          All
        </button>
        <button type="button" class="filter-chip" data-filter="holiday">
          <span class="chip-dot" style="background: var(--holiday);"></span>
          Holidays
        </button>
        <button type="button" class="filter-chip" data-filter="gp">
          <span class="chip-dot" style="background: var(--gp);"></span>
          GP Leave
        </button>
        <button type="button" class="filter-chip" data-filter="mess">
          <span class="chip-dot" style="background: var(--mess);"></span>
          Mess Closed
        </button>
      </div>
    </section>

    <!-- SECTION 1: Calendar Month View -->
    <main class="calendar-view-section" id="calendar-view-section">
      <!-- Month Navigation Bar -->
      <div class="month-nav-bar">
        <button type="button" class="month-nav-btn" id="prev-month-btn" aria-label="Previous month">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <button type="button" class="month-display-btn" id="month-display-btn" aria-label="Pick month">
          <span class="month-display-text" id="month-display-text">November 2026</span>
          <svg class="month-display-icon" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </button>

        <button type="button" class="today-chip-btn" id="today-chip-btn">Today</button>

        <button type="button" class="month-nav-btn" id="next-month-btn" aria-label="Next month">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>

      <!-- Calendar Month Card -->
      <div class="calendar-card" id="calendar-card">
        <!-- 7-Column Weekday Headers -->
        <div class="weekdays-grid">
          <div class="weekday-col weekend">Sun</div>
          <div class="weekday-col">Mon</div>
          <div class="weekday-col">Tue</div>
          <div class="weekday-col">Wed</div>
          <div class="weekday-col">Thu</div>
          <div class="weekday-col">Fri</div>
          <div class="weekday-col">Sat</div>
        </div>

        <!-- 7-Column Dates Grid -->
        <div class="dates-grid" id="dates-grid">
          <!-- Day cells generated dynamically via app.js -->
        </div>
      </div>

      <!-- Color Legend -->
      <div class="legend-card">
        <div class="legend-title">Colour Code Legend</div>
        <div class="legend-grid">
          <div class="legend-item">
            <span class="legend-swatch swatch-holiday"></span>
            <span>Public Holiday</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch swatch-gp"></span>
            <span>GP Period</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch swatch-festival"></span>
            <span>Festival Holiday</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch swatch-an"></span>
            <span>Half-Day (AN Start)</span>
          </div>
          <div class="legend-item" style="grid-column: span 2;">
            <span class="legend-swatch swatch-mess"></span>
            <span>Hostel Mess Closed (Striped)</span>
          </div>
        </div>
      </div>

      <!-- Quick Action Cards -->
      <div class="action-cards-bar">
        <button type="button" class="action-card-btn" id="action-export-all">
          <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          <div>
            <div>Add to Calendar</div>
            <div style="font-size: 11px; font-weight: 500; color: var(--text-muted);">Sync all to Google/iOS</div>
          </div>
        </button>
        <button type="button" class="action-card-btn" id="action-remind">
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <div>
            <div>Reminder Alert</div>
            <div style="font-size: 11px; font-weight: 500; color: var(--text-muted);">1-day before leave</div>
          </div>
        </button>
      </div>
    </main>

    <!-- SECTION 2: Upcoming List View -->
    <main class="upcoming-view-section hidden" id="upcoming-view-section">
      <div id="upcoming-list-container">
        <!-- Upcoming leave cards generated dynamically -->
      </div>
    </main>

    <!-- Bottom Sheet Modal (iOS Style) -->
    <div class="bottom-sheet-backdrop" id="bottom-sheet-backdrop"></div>
    <div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle-bar"></div>
      
      <div class="sheet-header">
        <div>
          <div class="sheet-date-text" id="sheet-date-text">Date</div>
          <h2 class="sheet-title" id="sheet-title">Event Title</h2>
        </div>
        <button type="button" class="sheet-close-btn" id="sheet-close-btn" aria-label="Close details">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <div class="sheet-badges" id="sheet-badges"></div>
      <div class="sheet-info-cards" id="sheet-info-cards"></div>

      <div class="sheet-actions">
        <button type="button" class="sheet-action-btn btn-primary" id="sheet-export-btn">
          <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
          Add to Calendar
        </button>
        <button type="button" class="sheet-action-btn btn-secondary" id="sheet-share-btn">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
          Share
        </button>
      </div>
    </div>

    <!-- Month Picker Quick Dialog -->
    <div class="dialog-backdrop" id="month-dialog-backdrop">
      <div class="month-picker-dialog" role="dialog" aria-modal="true">
        <div class="picker-header">
          <div class="picker-title">Jump to Month</div>
          <button type="button" class="sheet-close-btn" id="close-picker-btn" aria-label="Close month picker">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
        </div>
        <div class="picker-grid" id="month-picker-grid">
          <!-- Month chips (June 2026 to May 2027) generated here -->
        </div>
      </div>
    </div>

    <!-- In-App Toast Pill -->
    <div class="toast-notice" id="toast-notice" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <span id="toast-text">Notification</span>
    </div>

  </div>

  <!-- Scripts: Data first, then App logic -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
